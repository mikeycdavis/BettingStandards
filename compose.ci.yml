# The isolated CI environment. Invoked only through scripts/ci.ps1 or scripts/ci.sh, which supply a
# unique `-p` project name so that concurrent repositories, or two runs of this one, cannot collide
# on container, network, or volume names.
#
# Run it directly at your own risk: without the wrapper you get the default project name, and the
# cleanup guarantees documented in docs/local-ci.md are the wrapper's, not compose's.

services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    # UNIQUE PER RUN, and this is load-bearing rather than tidiness.
    #
    # This was `betting-standards-ci:local` — a single shared tag. A unique compose PROJECT name
    # isolates containers and networks, but it does NOT isolate an image tag, and the tag is what
    # actually gets executed. Two concurrent runs of this repository interleave like this:
    #
    #     run A: build  → tag betting-standards-ci:local at A's tree
    #     run B: build  → RETAGS betting-standards-ci:local at B's tree
    #     run A: run    → executes B's code, reports PASS, records A's SHA
    #
    # That is a direct falsifier of "the pushed commit is exactly the commit that passed": commit A
    # gets pushed on the strength of run B's code. The tag now carries the run id, so no other run
    # can move it. scripts/ci.* additionally resolve the built image ID and execute that, and record
    # it in the evidence file — so what ran is auditable rather than inferred from a tag.
    #
    # The layer cache is content-addressed and unaffected by the tag, so this costs nothing; the
    # wrapper deletes its own tag on teardown, which frees the name without touching cached layers.
    image: "betting-standards-ci:${CI_IMAGE_TAG:?scripts/ci.ps1 or ci.sh must set a unique tag per run}"
    # NO NETWORK. docs/architecture.md states that this repository has "no server, no database, and
    # no network I/O". Running the pipeline with the network removed turns that from a claim into an
    # enforced property: a check that quietly started reaching the internet fails here rather than
    # passing on a machine that happened to be online.
    #
    # A repository reusing this pattern that *does* need dependencies removes this line, declares its
    # services below, and lists them under `depends_on` with `condition: service_healthy`.
    network_mode: none
    environment:
      # Set by scripts/ci.* from the SHA it resolved on the host. The image has no .git, so this is
      # the only way the run knows which commit it is evaluating — and it is the same value the
      # submit-pr invariant is checked against.
      CI_COMMIT_SHA: "${CI_COMMIT_SHA:-}"
      CI_BRANCH: "${CI_BRANCH:-}"
      # The image ID scripts/ci.* resolved after building and is executing. Recorded in the evidence
      # file so "which image actually ran" is auditable rather than inferred from a mutable tag.
      CI_IMAGE_ID: "${CI_IMAGE_ID:-}"
    # NO HOST PATHS ARE MOUNTED. Not one. No source mount, no SSH agent, no Docker socket, no
    # credential helper, no home directory.
    #
    # The evidence file used to arrive via a bind mount of ./artifacts/local-ci. That assumed the
    # host-created directory was writable by the container's uid 1000 — true on Docker Desktop, and
    # frequently false on Linux or a self-hosted runner, where an otherwise passing pipeline would
    # fail at the last step writing latest.json, with a permission error that looks nothing like the
    # check it appears to come from.
    #
    # The result is now written inside the container and copied out with `docker cp` after the run,
    # which works on a stopped container and needs no shared uid. That removes the failure mode
    # instead of documenting it.
    # A CI run must terminate with a verdict; a container that restarts on failure would hide one.
    restart: "no"
    init: true
#
# ── Extension point for repositories that DO have dependencies ────────────────────────────────────
#
# This repository declares none (ci/pipeline.json → services.required is empty). The reusable shape
# is below, kept as a comment rather than as a disabled service so nothing here is a fiction:
#
#   services:
#     db:
#       image: mcr.microsoft.com/mssql/server:2022-latest
#       environment:
#         ACCEPT_EULA: "Y"
#         MSSQL_SA_PASSWORD: "${CI_DB_PASSWORD:?set a throwaway password in the CI shell, never here}"
#       healthcheck:
#         test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
#         interval: 5s
#         timeout: 5s
#         retries: 30
#         start_period: 20s
#       tmpfs:
#         - /var/opt/mssql/data     # disposable by construction: no named volume, no host path
#     ci:
#       depends_on:
#         db:
#           condition: service_healthy   # a real health gate, not a sleep
#
# Three rules that make that safe, and that scripts/ci.* already assume:
#   - the database lives in the compose project, so `down -v` destroys it and nothing else;
#   - the password comes from the CI shell environment, never from a committed file;
#   - the port is NOT published to the host, so a developer's own SQL Server on 1433 is untouched
#     and unreachable from here.
