name: ci

# THIS WORKFLOW DOES NOT DEFINE THE PIPELINE.
#
# The stage list lives in ci/pipeline.json and is executed by scripts/ci-stages.mjs. The same runner,
# reading the same manifest, is what the local Docker gate executes (scripts/ci.ps1 | ci.sh). There
# is deliberately no second copy of the stage list here: the previous version of this file listed the
# eight steps inline, and keeping that would have meant a local pass and a hosted pass could be
# claims about different pipelines.
#
# Relationship to the local gate, stated plainly rather than implied:
#
#   ci/pipeline.json  ──▶  scripts/ci-stages.mjs  ──┬──▶  scripts/ci.* (Docker, the local gate)
#                                                   └──▶  this workflow (GitHub-hosted)
#
# The LOCAL Docker run is the authoritative gate for this repository. A PR is verified by
# scripts/submit-pr.* before it is ever pushed; see docs/local-ci.md. This workflow is a second
# opinion running on GitHub's infrastructure, and it is not required to be green for the local
# invariant to hold — which matters, because hosted Actions on this account have run exactly once
# and failed before executing a single step.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # GitHub-hosted: runs the pipeline directly on the runner. Docker is not used here because the
  # runner is already an ephemeral, clean machine — the isolation the container provides locally is
  # what a fresh runner gives for free. Both paths execute the identical stage list.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches ci/pipeline.json → runtime.node, so a failure here reproduces in the container.
          node-version: "20"

      # No install step. This repository has zero third-party dependencies, and that decision is
      # enforced structurally rather than by policy: if an `npm ci` ever appears here, the decision
      # changed and ADR 0006 needs revisiting. test/local-ci.test.mjs asserts this file has none.

      - name: Run the pipeline (ci/pipeline.json)
        run: node scripts/ci-stages.mjs --verbose
        env:
          CI_ENVIRONMENT: github-hosted
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}

      # The machine-readable result, kept for the same reason the local run writes one: a verdict you
      # cannot inspect afterwards is a verdict you have to take on faith.
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ci-result
          path: artifacts/local-ci/latest.json
          if-no-files-found: warn

  # Optional, and not enabled: a self-hosted runner would execute the SAME Docker gate a developer
  # runs, with no redesign. Documented rather than configured, because this repository has no
  # self-hosted runner today and a workflow referencing one that does not exist would sit queued
  # forever — which is indistinguishable from passing, and worse than absent.
  #
  #   docker-gate:
  #     runs-on: [self-hosted, linux, docker]
  #     steps:
  #       - uses: actions/checkout@v4
  #       - run: ./scripts/ci.sh
