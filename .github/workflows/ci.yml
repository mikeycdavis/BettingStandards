name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step. This repository has zero third-party dependencies, and that decision is
      # enforced structurally rather than by policy: if an `npm ci` ever appears here, the decision
      # changed and ADR 0006 needs revisiting.

      # Proves the standards series and the prohibition register have not silently changed shape.
      # artifacts/standards-source-inventory.json was reviewed by a human and committed; this
      # compares extraction from the source prompts *against* it rather than re-deriving counts.
      # It is also protection #2 of the standards-integrity invariant: a prohibition cannot be
      # deleted, renamed, or reclassified without failing here.
      - name: Source inventory
        run: npm run inventory

      # Holds each standard to its own word: any block claiming to be verbatim from a source prompt
      # must be verbatim, and any examples/ path a standard cites must exist.
      - name: Source fidelity
        run: npm run fidelity

      # Validates project-policy.yml and betting-policy.yml against their schemas. Exit 2 (malformed)
      # and exit 1 (a compliance condition such as an expired exception) are both failures here, and
      # both are meant to be: a policy nothing can read is worse than one that reports a problem.
      - name: Policies
        run: npm run policy

      # Mermaid source vs its embedded copies. Text comparison, no rendering — which is what lets a
      # zero-dependency repository enforce diagram freshness at all.
      - name: Diagram freshness
        run: npm run diagrams

      # Re-derives every recorded number in examples/ledger from its inputs and re-evaluates the
      # decision rule. This is the check the whole pack exists to make mechanical, so it runs before
      # the unit tests: a broken worked example should fail with its own report, not as a test name.
      - name: Decision records
        run: npm run check

      - name: Test
        run: npm test

      # The standards repository is audited by its own audit. Deliberately not --strict: that flag
      # fails on warnings too, which turns every advisory finding into a broken build, and the
      # predictable result is that someone disables the step. The gate on *errors* is the assertion
      # in test/audit.test.mjs that this repository has no error-severity findings, which ran above.
      - name: Audit this repository
        run: npm run audit

      # The gate. `validate` applies this repository's own policy and exits 1 on a required-rule
      # failure or a forbidden-rule violation (BLOCKED_BY_INVARIANT), and 2 if a policy cannot be
      # read. This is the command adopting projects are told to gate on, so it is the one this
      # repository gates on.
      - name: Validate this repository
        run: npm run validate
