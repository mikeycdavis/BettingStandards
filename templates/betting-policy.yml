# Betting policy — the thresholds and caps your decisions will be judged against.
#
# generated by: standards init
#
# Every value is a string. The parser returns all scalars as strings so the schema can check a
# pattern before anything coerces; the tooling performs the single conversion to number.
#
# THESE NUMBERS ARE PLACEHOLDERS. Replace them deliberately. They are the only place in this
# framework where your risk tolerance is expressed, and copying someone else's is copying their
# tolerance for losing money.
#
# Changing a value here does not re-judge past decisions: each decision record pins the digest of the
# policy it was made under, so old records remain visibly decisions taken under different rules.

# The smallest edge, AFTER the uncertainty discount, that may support a BET.
# Set it above what transaction costs and your own estimation error consume. An edge smaller than
# your error bar is noise, and betting it is betting on noise.
minEdge: "0.02"

# The fraction of full Kelly to stake, in (0, 1]. Full Kelly is optimal only if your probability
# estimate is exactly right. It is an estimate. Fractional Kelly is the standard response.
kellyMultiplier: "0.25"

# One unit as a fraction of bankroll.
unitPercent: "0.01"

# The hard ceiling on any single stake, applied even when Kelly recommends more.
maxSingleBetPct: "0.03"

# The ceiling on total stake within one correlation group. Wagers sharing an outcome driver are one
# wager wearing several tickets; this is the cap that says so.
maxGroupExposurePct: "0.06"

# The ceiling on all open stake at once.
maxTotalExposurePct: "0.15"

# How old a price snapshot may be when a decision is recorded.
maxOddsAgeMinutes: "15"

# How old the probability estimate may be when a decision is recorded.
maxPredictionAgeMinutes: "720"

# At or beyond this price, a minimum uncertainty discount applies. The proportional vig-removal
# method overstates the fair probability of long prices; this is the mechanical guard on that bias.
longshotOddsThreshold: "6.0"
longshotMinDiscount: "0.20"

note: "Replace these placeholder values with your own, and record when you last reviewed them."
