# Project policy — which betting standards apply to this project, and how.
#
# generated by: standards init
#
# Three mechanisms live here and they are NOT interchangeable:
#
#   applicability   the rule has no subject in this project. Requires a reason.
#   exceptions      the rule applies and you are knowingly not satisfying it. Requires approval,
#                   and expires.
#   attestations    the rule applies, a human reviewed it, and it is satisfied. Evidence, not a
#                   waiver — it never overrides an automated finding, and it goes stale when what
#                   was reviewed changes.
#
# Collapsing applicability and exceptions is the classic mistake: it lets real non-compliance hide
# inside a claim of irrelevance. Keep them apart.
#
# ONE THING YOU CANNOT DO HERE: waive a prohibition. Every rule at level `forbidden` is
# non-exemptible. An exception declared against one is rejected and reported as a finding — the
# attempt is itself the violation. The only escape is that the rule genuinely has no subject in this
# project, declared through applicability with a reason.

standardVersion: "1.0.0"
project: "REPLACE-ME"

exceptions: []

# Declare a rule not-applicable only when its subject genuinely does not exist here. Every entry
# needs a reason — a declaration with no reason cannot be told apart from a rule someone forgot —
# and should carry the condition that would make it wrong again.
#
# applicability:
#   line.clv-computed:
#     status: not-applicable
#     reason: "Our book publishes no closing prices, so closing-line value cannot be observed."
#     reviewedAt: "2026-01-01"
#     revisitWhen: "We start using a book that publishes closing prices."

# Rules that prohibit motives — chasing losses, betting for action, judging a decision by its result,
# leaking future information into a backtest — cannot be checked by any tool. They report
# not-evaluated until a human records a review here. That is the honest state.
#
# attestations:
#   bankroll.no-chasing-losses:
#     status: approved
#     reviewedBy: "Your Name"
#     reviewedAt: "2026-01-01"
#     evidence: "Reviewed every stake increase in the last quarter against its own recorded sizing."
#     reviewedAgainst:
#       paths: ["ledger"]
